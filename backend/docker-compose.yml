# Local development infrastructure for the Smart Donation backend.
#
# Start MySQL only:   docker compose up -d mysql
# Stop:               docker compose down
#
# The Spring Boot app itself runs locally via: mvn spring-boot:run

services:
  mysql:
    image: mysql:8.4
    container_name: smart-donation-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: smart_donation
      MYSQL_USER: smart_donation
      MYSQL_PASSWORD: smart_donation
      MYSQL_ROOT_PASSWORD: root
      TZ: UTC
    # Host port 3307 because a local MySQL already occupies 3306 on this machine.
    # Start the app with DB_PORT=3307 to use this container.
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: smart-donation-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  mysql-data:
  redis-data:
