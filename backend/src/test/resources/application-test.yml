spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MYSQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: false

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2s

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

  mail:
    host: localhost

jwt:
  secret: c21hcnQtZG9uYXRpb24tc3VwZXItc2VjcmV0LWtleS1mb3Itand0LWhzMjU2LXNpZ25pbmctMjAyNg==
  validity:
    accessToken: 86400000
    refreshToken: 604800000

logging:
  level:
    com.smartdonation: WARN
    org.springframework.security: WARN
